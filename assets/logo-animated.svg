<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024">
  <style>
    .cap { animation: hold 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .bar { transform-box: fill-box; transform-origin: center; animation: 3.2s ease-in-out infinite; }
    .b1, .b5 { animation-name: talk-a; }
    .b2, .b4 { animation-name: talk-b; }
    .b3 { animation-name: talk-c; }
    .b4 { animation-delay: 0.08s; }
    .b5 { animation-delay: 0.16s; }
    @keyframes hold {
      0%, 12%, 84%, 100% { transform: translateY(0); }
      18%, 78% { transform: translateY(5px); }
    }
    @keyframes talk-a {
      0%, 16%, 84%, 100% { transform: scaleY(1); }
      24% { transform: scaleY(1.6); } 34% { transform: scaleY(0.6); } 44% { transform: scaleY(2); }
      54% { transform: scaleY(0.8); } 64% { transform: scaleY(1.7); } 74% { transform: scaleY(0.7); }
    }
    @keyframes talk-b {
      0%, 16%, 84%, 100% { transform: scaleY(1); }
      22% { transform: scaleY(0.55); } 32% { transform: scaleY(1.45); } 42% { transform: scaleY(0.7); }
      52% { transform: scaleY(1.6); } 62% { transform: scaleY(0.6); } 72% { transform: scaleY(1.3); }
    }
    @keyframes talk-c {
      0%, 16%, 84%, 100% { transform: scaleY(1); }
      26% { transform: scaleY(0.5); } 36% { transform: scaleY(1.3); } 46% { transform: scaleY(0.65); }
      56% { transform: scaleY(1.35); } 66% { transform: scaleY(0.55); } 76% { transform: scaleY(1.2); }
    }
    @media (prefers-reduced-motion: reduce) { .cap, .bar { animation: none; } }
  </style>
  <rect x="4" y="4" width="112" height="112" rx="30" fill="#141416"/>
  <rect x="22" y="30" width="76" height="66" rx="18" fill="#b0372a"/>
  <g class="cap">
    <rect x="22" y="24" width="76" height="62" rx="18" fill="#ff6250"/>
    <rect x="28" y="30" width="64" height="48" rx="13" fill="#ff7363"/>
    <g fill="#ffffff">
      <rect class="bar b1" x="39.25" y="48" width="5.5" height="12" rx="2.75"/>
      <rect class="bar b2" x="48.25" y="43" width="5.5" height="22" rx="2.75"/>
      <rect class="bar b3" x="57.25" y="38" width="5.5" height="32" rx="2.75"/>
      <rect class="bar b4" x="66.25" y="43" width="5.5" height="22" rx="2.75"/>
      <rect class="bar b5" x="75.25" y="48" width="5.5" height="12" rx="2.75"/>
    </g>
  </g>
</svg>
