}
@font-face {
  font-family: "Inter Variable"; font-style: normal; font-display: swap; font-weight: 100 900;
  src: url("fonts/inter-latin-ext-wght-normal.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
:root {
  --bg: #0d0d0d;
  --text: #fafafa;
  --muted: #a3a3a3;
  --faint: #737373;
  --line: rgba(255, 255, 255, 0.1);
  --raised: #161616;
  --ice: 255, 255, 255;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: only dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  color: var(--text);
  font-family: "Inter Variable", "Segoe UI", system-ui, sans-serif;
  font-feature-settings: "cv02", "cv03", "cv04", "cv11", "ss01";
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p, figure { margin: 0; }
:focus-visible { outline: 2px solid rgb(var(--ice)); outline-offset: 3px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap { width: min(980px, 100% - 40px); margin: 0 auto; }

/* The first screen: what you say, on paper. */
.page {
  position: relative;
  isolation: isolate;
  background: var(--bg);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
}
#stage { position: absolute; z-index: -1; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.top { display: flex; align-items: center; justify-content: space-between; width: min(1180px, 100% - 56px); margin: 0 auto; padding: 22px 0; }
.word-mark { display: inline-flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 620; letter-spacing: -0.02em; }
.word-mark svg { width: 21px; height: 21px; }
.top-links { display: flex; align-items: center; gap: 22px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.top-links a { display: inline-flex; align-items: center; gap: 7px; }
.top-links a:hover { color: var(--text); }

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 520px);
  align-items: center;
  gap: 56px;
  width: min(1180px, 100% - 56px);
  margin: 0 auto;
  padding: 12px 0 40px;
}
.hero-copy { transition: opacity 320ms ease; }
h1 { font-size: clamp(44px, 6.3vw, 82px); font-weight: 640; line-height: 0.98; letter-spacing: -0.05em; }
/* The page comes in once: each line from under its own edge. */
.line { display: block; overflow: hidden; padding-bottom: 0.1em; margin-bottom: -0.1em; }
.line > span { display: block; animation: line-in 900ms cubic-bezier(0.16, 1, 0.3, 1) both; }
.line + .line > span { animation-delay: 90ms; }
@keyframes line-in { from { transform: translateY(105%); } }
@keyframes come-in { from { opacity: 0; transform: translateY(14px); } }
.top { animation: come-in 700ms ease-out both; }
.hero-copy p { animation: come-in 800ms cubic-bezier(0.16, 1, 0.3, 1) 240ms both; }
.cta { animation: come-in 800ms cubic-bezier(0.16, 1, 0.3, 1) 340ms both; }
.foot { animation: come-in 800ms ease-out 700ms both; }
.hero-copy p { max-width: 470px; margin-top: 20px; color: var(--muted); font-size: 17px; line-height: 1.55; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.action {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 44px; padding: 0 18px; border-radius: 10px;
  font-size: 14px; font-weight: 580; color: var(--text); background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px var(--line);
}
.action:hover { background: rgba(255, 255, 255, 0.1); }
.action.main { color: #0d0d0d; background: #ffffff; box-shadow: none; }
.action.main:hover { background: #e5e5e5; }

.install { display: flex; align-items: center; gap: 12px; max-width: 100%; margin-top: 14px; padding: 0; border: 0; background: none; color: var(--faint); font: inherit; font-size: 12.5px; cursor: pointer; text-align: left; }
.install code { overflow: hidden; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: nowrap; text-overflow: ellipsis; }
.install span { flex: none; color: var(--muted); font-weight: 560; }
.install:hover, .install:hover span { color: var(--text); }

/* The sheet: where the words land, folded at one corner like the mark. */
.desk {
  --fold: calc(44px + var(--voice, 0) * 16px);
  position: relative;
  padding-bottom: 34px;
  transform: perspective(1400px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform 500ms cubic-bezier(0.16, 1, 0.3, 1);
  animation: desk-in 1100ms cubic-bezier(0.16, 1, 0.3, 1) 160ms both;
}
@keyframes desk-in { from { opacity: 0; translate: 0 34px; scale: 0.96; } }
.sheet {
  position: relative;
  min-height: clamp(240px, 38vh, 330px);
  padding: 22px 26px 56px;
  color: #111111;
  background: #ffffff;
  clip-path: polygon(0 0, calc(100% - var(--fold)) 0, 100% var(--fold), 100% 100%, 0 100%);
  border-radius: 6px;
}
.fold {
  position: absolute; z-index: 1; top: 0; right: 0; width: var(--fold); height: var(--fold);
  background: #c4c4c4;
  clip-path: polygon(0 0, 100% 100%, 0 100%);
}
.desk-shadow { position: absolute; inset: 14px 6px 40px; border-radius: 10px; background: rgba(0, 0, 0, 0.5); filter: blur(30px); }
.sheet-head { display: flex; align-items: center; gap: 8px; padding-right: 44px; color: #737373; font-size: 12.5px; font-weight: 540; }
.sheet-head b { font-weight: 560; color: #262626; }
.written { margin-top: 18px; font-size: clamp(18px, 1.9vw, 22px); font-weight: 480; line-height: 1.42; letter-spacing: -0.018em; }
.w { display: inline-block; white-space: pre; }
.ink { border-radius: 4px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.ink.flash { animation: flash 1400ms ease-out; }
@keyframes flash { from { background: rgba(0, 0, 0, 0.1); box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1); } to { background: transparent; box-shadow: 0 0 0 3px transparent; } }
.w.fixed { border-radius: 4px; background: #111111; color: #ffffff; padding: 0 4px; margin: 0 -4px; transition: background 700ms ease, color 700ms ease; }
.w.fixed.settled { background: transparent; color: inherit; }
/* Words on their way: white on black, black on the paper. */
.air { position: absolute; z-index: 3; inset: 0; overflow: hidden; pointer-events: none; mix-blend-mode: difference; }
.fly { position: absolute; left: 0; top: 0; color: #ffffff; font-weight: 480; letter-spacing: -0.018em; white-space: pre; will-change: transform; }
.written .caret { display: inline-block; width: 2px; height: 1.02em; margin-left: 2px; vertical-align: -0.16em; background: #111111; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.tag { display: inline-block; margin-left: 8px; padding: 0 7px; border-radius: 5px; background: #111111; color: #ffffff; font-size: 12.5px; font-weight: 580; letter-spacing: 0; vertical-align: 2px; animation: rise 320ms var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }

/* The pill: the same one the app shows while you speak. Here you press it. */
.pill {
  position: absolute; z-index: 2; left: 50%; bottom: 0; display: flex; align-items: center; gap: 10px;
  height: 56px; min-width: 300px; padding: 0 12px 0 16px; border: 0; border-radius: 14px; transform: translateX(-50%); transition: transform 240ms cubic-bezier(0.34, 1.56, 0.64, 1), background 120ms ease;
  font: inherit; font-size: 14px; font-weight: 540; color: #fafafa; white-space: nowrap; cursor: pointer; touch-action: manipulation;
  background: #1a1a1a;
  box-shadow: 0 -0.5px 0 rgba(255, 255, 255, 0.12), 0 0 0 0.5px rgba(255, 255, 255, 0.2), 0 16px 34px rgba(0, 0, 0, 0.55), 0 0 calc(8px + var(--voice, 0) * 36px) rgba(var(--ice), calc(0.04 + var(--voice, 0) * 0.2));
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.pill:hover { background: #222222; }
.pill:active { transform: translateX(-50%) scale(0.97); }
.pill[data-down] { transform: translateX(-50%) translateY(2px) scale(0.985); }
.pill-wings { position: relative; flex: none; width: 24px; height: 24px; }
.pill-wings svg { display: block; width: 100%; height: 100%; overflow: visible; }
.pill-wings .near, .pill-wings .far { transform-box: view-box; transform-origin: 12px 23.3px; }
.pill-wings .near { transform: rotate(calc(var(--voice, 0) * -13deg)); }
.pill-wings .far { transform: rotate(calc(var(--voice, 0) * 13deg)); }
.pill-state { display: block; flex: 1; text-align: left; }
.pill-state small { margin-left: 8px; color: #8a8a8a; font-size: 13px; font-weight: 480; }
kbd.pill-key, .pill-time { font-family: inherit; flex: none; height: 28px; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 7px; font-size: 12.5px; font-weight: 560; color: #d4d4d4; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.16); }
.pill-time { font-variant-numeric: tabular-nums; }
.pill-time[hidden], .pill-key[hidden] { display: none; }
.sound { position: absolute; z-index: 2; right: -6px; bottom: 12px; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 8px; color: var(--faint); background: none; cursor: pointer; }
.sound:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
.sound .off { display: none; }
.sound[aria-pressed="false"] .on { display: none; }
.sound[aria-pressed="false"] .off { display: block; }

.foot { display: flex; justify-content: space-between; gap: 16px; width: min(1180px, 100% - 56px); margin: 0 auto; padding: 0 0 22px; color: var(--faint); font-size: 13px; }
.foot span, .foot a { white-space: nowrap; }
.foot a:hover { color: var(--text); }
@media (max-width: 900px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 36px; padding-bottom: 40px; }
  .desk { width: min(520px, 100%); margin: 0 auto; }
  .sound { right: 0; bottom: -2px; }
  .sheet { min-height: 220px; }
  .page[data-playing] .hero-copy { opacity: 0.28; }
  .pill { min-width: 264px; left: 46%; }
}
@media (prefers-reduced-motion: reduce) {
  .written .caret { animation: none; }
  .line > span, .top, .hero-copy p, .cta, .foot, .desk { animation: none; }
}

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  /* ------------------------------------------------ sound: the blue switch from app/src/sound.rs */
  const sfx = (() => {
    let ctx = null;
    const RATE = 48000, TAU = Math.PI * 2, made = {};
    function noise(seed) {
      let s = seed >>> 0;
      return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return (s >>> 8) / (1 << 23) - 1; };
    }
    function burst(out, at, hz, q, decay, gain, seed) {
      const w = TAU * hz / RATE, alpha = Math.sin(w) / (2 * q), a0 = 1 + alpha;
      const b0 = alpha / a0, b2 = -alpha / a0, a1 = -2 * Math.cos(w) / a0, a2 = (1 - alpha) / a0;
      let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
      const n = noise(seed), start = Math.floor(at * RATE);
      for (let i = start; i < out.length; i++) {
        const x = (i - start) / RATE;
        if (x > decay * 12) break;
        const v = n(), y = b0 * v + b2 * x2 - a1 * y1 - a2 * y2;
        x2 = x1; x1 = v; y2 = y1; y1 = y;
        out[i] += gain * Math.min(1, x / 0.00015) * Math.exp(-x / decay) * y;
      }
    }
    function ring(out, at, hz, decay, gain) {
      const start = Math.floor(at * RATE);
      for (let i = start; i < out.length; i++) {
        const x = (i - start) / RATE;
        if (x > decay * 12) break;
        out[i] += gain * Math.sin(TAU * hz * x) * Math.exp(-x / decay);
      }
    }
    function level(out, peak) {
      let m = 1e-6;
      for (const v of out) m = Math.max(m, Math.abs(v));
      for (let i = 0; i < out.length; i++) out[i] *= peak / m;
      return out;
    }
    const make = {
      press() {
        const o = new Float32Array(RATE * 0.09);
        burst(o, 0, 4300, 1.4, 0.0011, 1, 7); burst(o, 0, 7600, 1.8, 0.0006, 0.45, 13); ring(o, 0, 3150, 0.0035, 0.18);
        burst(o, 0.012, 1250, 1, 0.0028, 0.6, 29); ring(o, 0.012, 540, 0.0055, 0.22); ring(o, 0.012, 1900, 0.0035, 0.1);
        return level(o, 0.62);
      },
      release() {
        const o = new Float32Array(RATE * 0.08);
        burst(o, 0, 4900, 1.4, 0.0009, 1, 11); ring(o, 0, 3400, 0.003, 0.14);
        burst(o, 0.007, 1700, 1, 0.0022, 0.4, 31); ring(o, 0.007, 720, 0.0045, 0.14);
        return level(o, 0.45);
      },
      done() {
        const o = new Float32Array(RATE * 0.06);
        burst(o, 0, 3900, 1.3, 0.0008, 1, 17); ring(o, 0, 950, 0.0035, 0.12);
        return level(o, 0.22);
      },
    };
    return {
      // Browsers only allow sound after the visitor clicked something.
      unlock() { if (!ctx) try { ctx = new AudioContext({ sampleRate: RATE }); } catch (e) {} },
      play(name) {
        if (!ctx) return;
        if (!made[name]) { const data = make[name](); const b = ctx.createBuffer(1, data.length, RATE); b.copyToChannel(data, 0); made[name] = b; }
        const src = ctx.createBufferSource(); src.buffer = made[name]; src.connect(ctx.destination); src.start();
      },
    };
  })();

  /* ------------------------------------------------ the show: what's said flies up, what's meant lands on the sheet */
  const page = $("page"), canvas = $("stage"), air = $("air"), key = $("key"), desk = $("desk"), sheet = $("sheet"), written = $("written");
  const pillState = $("pill-state"), pillTime = $("pill-time"), pillKey = $("pill-key"), soundButton = $("sound"), appLabel = $("app-label");
  const ctx = canvas.getContext("2d");
  const WHITE = "255, 255, 255";
  const FILLER = new Set(["so", "um", "uh", "ähm", "also", "like", "basically", "just", "okay"]);
  // Each scene: the voice in audio/, the app it goes into, and what lands on the sheet. `fix` is a
  // word that lands wrong and gets corrected once. Without its audio a scene still plays, on `say`.
  const SCENES = [
    { id: "learn", app: "Notes", say: "So, um, I finally switched to Vorto, and it, like, basically just writes what I say.", clean: "I finally switched to Warto and it writes what I say.", fix: ["Warto", "Vorto"], heard: { vorto: "Warto" } },
    { id: "mail", app: "Outlook", say: "Hey Sarah, uh, thanks for the quick reply. Thursday at ten, um, works great for me. See you then.", clean: "Hey Sarah, thanks for the quick reply. Thursday at ten works great for me. See you then." },
    { id: "german", app: "WhatsApp", say: "Hallo Sara, ähm, können wir das Meeting, also, auf morgen um zehn verschieben? Danke dir.", clean: "Hallo Sara, können wir das Meeting auf morgen um zehn verschieben? Danke dir." },
    { id: "prompt", app: "Claude", say: "Can you, um, write me a function that, like, sorts the list and, uh, removes the duplicates?", clean: "Write a function that sorts the list and removes the duplicates." },
    { id: "note", app: "Reminders", say: "Okay, so, um, remind me to call the dentist tomorrow morning, and, uh, pick up the kids at three.", clean: "Remind me to call the dentist tomorrow morning and pick up the kids at three." },
  ];
  const plain = (word) => word.replace(/[^\p{L}\p{N}]/gu, "").toLowerCase();
  // When each word is said, measured by scripts/voice-times.py.
  const timed = fetch("audio/scenes.json").then((r) => r.json()).catch(() => ({}));
  const estimate = (say) => {
    let t = 0.1;
    return say.split(" ").map((w) => { const at = t; t += 0.14 + w.length * 0.045; return { w, t: at }; });
  };

  /* The voice. Browsers keep sound off until a click, so the show starts silent. */
  let audio = null, analyser = null, levels = null, playing = null, soundOn = false;
  const buffers = {};
  const click = (name) => { if (soundOn) sfx.play(name); };
  function unlock() {
    sfx.unlock();
    if (audio) { audio.resume?.(); return; }
    try {
      audio = new AudioContext();
      analyser = audio.createAnalyser();
      analyser.fftSize = 512;
      levels = new Float32Array(analyser.fftSize);
      analyser.connect(audio.destination);
    } catch (e) { audio = null; }
  }
  async function load(id) {
    if (!audio) return null;
    buffers[id] ??= fetch(`audio/${id}.mp3`).then((r) => r.arrayBuffer()).then((b) => audio.decodeAudioData(b)).catch(() => null);
    return buffers[id];
  }
  function stopVoice() {
    if (playing) { try { playing.source.stop(); } catch (e) {} playing = null; }
  }
  function loudness() {
    if (!playing || !analyser) return 0;
    analyser.getFloatTimeDomainData(levels);
    let sum = 0;
    for (const v of levels) sum += v * v;
    return Math.min(1, Math.sqrt(sum / levels.length) * 4.2);
  }

  /* The canvas behind the page: words in the air, sparks and rings, drawn only while something moves. */
  let width = 0, height = 0, dpr = 1;
  function size() {
    const rect = page.getBoundingClientRect();
    dpr = Math.min(devicePixelRatio || 1, 2);
    width = rect.width; height = rect.height;
    canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
  }
  size();
  addEventListener("resize", size, { passive: true });
  const box = (el) => {
    const a = el.getBoundingClientRect(), b = page.getBoundingClientRect();
    return { x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height / 2, w: a.width, h: a.height };
  };

  const floating = [], sparks = [], rings = [];
  let voice = 0, target = 0, animating = false, script = null;

  function spark(x, y, power = 1) {
    const angle = Math.random() * Math.PI * 2, speed = (0.5 + Math.random() * 3) * power;
    sparks.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 0.4, life: 1, decay: 0.016 + Math.random() * 0.028, size: 0.6 + Math.random() * 1.4 });
  }
  // Places for words in the free space around the sheet, nearest the pill first, so none overlap.
  let slots = [];
  function findSlots() {
    const pillBox = box(key), deskBox = box(desk), copy = box(page.querySelector(".hero-copy"));
    const blocked = [deskBox];
    if (width > 900) blocked.push(copy);
    const free = [];
    for (let y = 92; y < height - 44; y += 42) {
      for (let x = 70 + (Math.round(y / 42) % 2) * 44; x < width - 60; x += 118) {
        const hit = blocked.some((b) => Math.abs(x - b.x) < b.w / 2 + 62 && Math.abs(y - b.y) < b.h / 2 + 26);
        if (!hit) free.push({ x, y, d: Math.hypot(x - pillBox.x, (y - pillBox.y) * 1.5) });
      }
    }
    slots = free.sort((a, b) => a.d - b.d);
  }
  function say(raw, index, now) {
    const bare = plain(raw);
    const text = script?.heard?.[bare] ?? raw.replace(/[,.?!]+$/, "");
    const from = box(key);
    // Not in order: the near places fill up in a scatter, not a line.
    const pick = slots.length ? slots[(index * 7) % Math.min(slots.length, Math.max(script.words.length, 12))] : { x: from.x, y: from.y - 120 };
    floating.push({
      text, key: plain(text), filler: FILLER.has(bare),
      x: from.x + (pick.x < from.x ? -1 : 1) * (from.w / 2 - 8), y: from.y - 6,
      tx: pick.x + (Math.random() - 0.5) * 18, ty: pick.y + (Math.random() - 0.5) * 8,
      born: now, size: 15 + Math.random() * 9,
      angle: (Math.random() - 0.5) * 0.14, seed: Math.random() * 6,
    });
  }
  // A word grows in with a little overshoot.
  const pop = (t) => { const k = Math.min(1, t / 0.28); return 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2); };

  let lastFrame = 0;
  function frame(time) {
    const dt = Math.min(0.1, (time - lastFrame) / 1000 || 0.016);
    lastFrame = time;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);
    if (script) {
      // The words leave the pill when the voice says them.
      const now = script.clock();
      let last = -1;
      while (script.next < script.words.length && script.words[script.next].t <= now) {
        say(script.words[script.next].w, script.next, time);
        script.next++;
      }
      if (script.next) last = script.words[script.next - 1].t;
      // Silent, the mark follows the rhythm of the words: up on each, then falling away.
      target = script.audible ? loudness() : now < script.duration && last >= 0 ? Math.max(0.12, 0.85 * Math.exp(-(now - last) * 3.4)) : 0;
    }
    voice += (target - voice) * (target > voice ? 0.42 : 0.14);
    page.style.setProperty("--voice", voice.toFixed(3));

    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.r += 6 * r.life + 1; r.life -= 0.026;
      if (r.life <= 0) { rings.splice(i, 1); continue; }
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(${WHITE}, ${0.24 * r.life})`; ctx.lineWidth = 1; ctx.stroke();
    }

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const w of floating) {
      // Quickly to its place, then hanging there, breathing with the voice.
      const k = 1 - Math.exp(-dt * 4.2);
      w.x += (w.tx - w.x) * k;
      w.y += (w.ty + Math.sin(time / 900 + w.seed) * 4 - w.y) * k;
      const grow = pop((time - w.born) / 1000) * (1 + voice * 0.05);
      ctx.save();
      ctx.translate(w.x, w.y); ctx.rotate(w.angle); ctx.scale(grow, grow);
      ctx.font = `${w.filler ? 430 : 580} ${w.size}px "Inter Variable", "Segoe UI", sans-serif`;
      ctx.fillStyle = w.filler ? "rgba(150, 150, 150, 0.7)" : "rgba(255, 255, 255, 0.95)";
      ctx.fillText(w.text, 0, 0);
      ctx.restore();
    }

    ctx.globalCompositeOperation = "lighter";
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vx *= 0.975; s.vy = s.vy * 0.975 + 0.03; s.life -= s.decay;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.beginPath(); ctx.arc(s.x, s.y, s.size * s.life, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${WHITE}, ${0.85 * s.life})`; ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    if (script || floating.length || sparks.length || rings.length || voice > 0.01) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, width, height); animating = false; }
  }
  const animate = () => { if (!animating) { animating = true; requestAnimationFrame(frame); } };

  /* The pill says what's going on, and each new state slides in. */
  function pill(state, note = "") {
    pillState.textContent = state;
    if (note) { const small = document.createElement("small"); small.textContent = note; pillState.append(small); }
    pillState.animate?.([{ opacity: 0, transform: "translateY(7px)" }, { opacity: 1, transform: "none" }], { duration: 240, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
  }
  function caret() { const c = document.createElement("span"); c.className = "caret"; return c; }

  /* The sheet: every word has its place. Real words fly there, filler burns up in the air. */
  function layOut(text) {
    written.textContent = "";
    const ink = document.createElement("span");
    ink.className = "ink";
    const spans = text.split(" ").map((word, i) => {
      if (i) ink.append(" ");
      const span = document.createElement("span");
      span.className = "w";
      span.textContent = word;
      span.style.opacity = "0";
      ink.append(span);
      return span;
    });
    written.append(ink);
    return { spans, ink };
  }
  async function land(spans, alive) {
    const fontSize = parseFloat(getComputedStyle(written).fontSize);
    const left = [...floating];
    const flights = [];
    spans.forEach((span, i) => {
      const at = left.findIndex((w) => w.key === plain(span.textContent));
      const end = box(span);
      if (at < 0) {
        // Said in other words: it simply rises into place.
        const anim = span.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }], { duration: 420, delay: 180 + i * 24, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "backwards" });
        span.style.opacity = "1";
        flights.push(anim.finished.catch(() => {}));
        return;
      }
      const [w] = left.splice(at, 1);
      const fly = document.createElement("span");
      fly.className = "fly";
      fly.textContent = span.textContent;
      fly.style.fontSize = `${fontSize}px`;
      air.append(fly);
      const start = `translate(${w.x}px, ${w.y}px) translate(-50%, -50%) rotate(${w.angle}rad) scale(${w.size / fontSize})`;
      // A slight arc, higher for words from further away.
      const midX = (w.x + end.x) / 2, midY = (w.y + end.y) / 2 - Math.min(70, Math.abs(end.x - w.x) * 0.14);
      const anim = fly.animate(
        [
          { transform: start },
          { transform: `translate(${midX}px, ${midY}px) translate(-50%, -50%) rotate(${w.angle * 0.3}rad) scale(${(w.size / fontSize + 1) / 2})`, offset: 0.55 },
          { transform: `translate(${end.x}px, ${end.y}px) translate(-50%, -50%)` },
        ],
        { duration: 620 + Math.random() * 120, delay: i * 30, easing: "cubic-bezier(0.45, 0, 0.1, 1)", fill: "both" },
      );
      flights.push(anim.finished.then(() => {
        fly.remove();
        span.style.opacity = "1";
        span.animate([{ transform: "scale(1.07)" }, { transform: "none" }], { duration: 200, easing: "ease-out" });
      }).catch(() => fly.remove()));
    });
    // What's left was only said, not meant: it burns up, one after the other.
    const burn = [...left];
    floating.length = 0;
    burn.forEach((w, i) => setTimeout(() => {
      if (!alive()) return;
      for (let n = w.filler ? 20 : 8; n > 0; n--) spark(w.x, w.y, w.filler ? 1.1 : 0.7);
      animate();
    }, i * 26));
    // The canvas stops drawing these words the moment their copies take over.
    animate();
    await Promise.all(flights);
  }
  // The words of the last scene lift off the page before the next.
  async function clear() {
    const spans = [...written.querySelectorAll(".w, .tag")];
    if (!spans.length) { written.textContent = ""; return; }
    await Promise.all(spans.map((span, i) => span.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-12px)" }], { duration: 260, delay: i * 9, easing: "ease-in", fill: "forwards" }).finished.catch(() => {})));
    written.textContent = "";
  }

  let run = 0, turn = 0;
  async function play() {
    const id = ++run;
    const alive = () => id === run;
    const scene = SCENES[turn % SCENES.length];
    stopVoice();
    air.textContent = "";
    floating.length = 0; script = null;
    await clear(); if (!alive()) return;
    findSlots();
    written.append(caret());
    const label = document.createElement("b");
    label.textContent = scene.app;
    appLabel.textContent = "";
    appLabel.append(label);
    label.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 });

    page.setAttribute("data-playing", "");
    key.setAttribute("data-down", "");
    pill("Listening", scene.app);
    pillKey.hidden = true; pillTime.hidden = false; pillTime.textContent = "0:00";
    animate();
    click("press");
    const k = box(key);
    rings.push({ x: k.x, y: k.y, r: k.h / 2, life: 1 });

    const measured = (await timed)[scene.id];
    const words = measured?.words ?? estimate(scene.say);
    const buffer = soundOn ? await load(scene.id) : null;
    if (!alive()) return;
    const duration = buffer?.duration ?? measured?.duration ?? words.at(-1).t + 0.5;
    let clock;
    if (buffer) {
      const source = audio.createBufferSource();
      source.buffer = buffer;
      source.connect(analyser);
      const startedAt = audio.currentTime + 0.04;
      source.start(startedAt);
      playing = { source };
      clock = () => audio.currentTime - startedAt;
    } else {
      const startedAt = performance.now();
      clock = () => (performance.now() - startedAt) / 1000;
    }
    script = { words, next: 0, clock, duration, audible: !!buffer, heard: scene.heard };
    animate();
    const ticking = setInterval(() => { pillTime.textContent = `0:${String(Math.max(0, Math.floor(clock()))).padStart(2, "0")}`; }, 200);
    while (alive() && clock() < duration + 0.1) await sleep(50);
    clearInterval(ticking);
    if (!alive()) return;

    // Let go: the words go where they belong.
    script = null; playing = null; target = 0;
    key.removeAttribute("data-down");
    click("release");
    pill("Writing");
    pillTime.hidden = true;
    const c = box(key);
    rings.push({ x: c.x, y: c.y, r: c.h / 2, life: 1 });
    const { spans, ink } = layOut(scene.clean);
    await land(spans, alive); if (!alive()) return;
    click("done");
    pill("Inserted", scene.app);
    page.removeAttribute("data-playing");
    // The sheet gives a little under the words, and they glow for a moment, as in the app.
    desk.animate([{ translate: "0 0" }, { translate: "0 3px" }, { translate: "0 0" }], { duration: 300, easing: "ease-out" });
    ink.classList.add("flash");

    if (scene.fix) {
      // One misheard word, fixed once, and Vorto keeps it.
      await sleep(900); if (!alive()) return;
      const wrong = spans.find((s) => s.textContent === scene.fix[0]);
      await wrong.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "translateY(-9px)" }], { duration: 170, easing: "ease-in", fill: "forwards" }).finished.catch(() => {});
      if (!alive()) return;
      wrong.textContent = scene.fix[1];
      wrong.getAnimations().forEach((a) => a.cancel());
      wrong.classList.add("fixed");
      wrong.animate([{ opacity: 0, transform: "translateY(9px)" }, { opacity: 1, transform: "none" }], { duration: 340, easing: "cubic-bezier(0.22, 1.4, 0.36, 1)" });
      const tag = document.createElement("span");
      tag.className = "tag"; tag.textContent = `Learned ${scene.fix[1]}`;
      written.append(tag);
      await sleep(1500); if (!alive()) return;
      wrong.classList.add("settled");
    }
    await sleep(scene.fix ? 1500 : 2600); if (!alive()) return;
    turn++;
    pill("Press for sound");
    while (document.hidden) { await sleep(400); if (!alive()) return; }
    play();
  }

  $("install").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("install").querySelector("code").textContent);
      $("install-note").textContent = "Copied";
      setTimeout(() => ($("install-note").textContent = "Copy"), 1400);
    } catch (e) {}
  });

  const setSound = (on) => {
    soundOn = on;
    soundButton.setAttribute("aria-pressed", String(on));
    if (!on) stopVoice();
  };
  // A press means: this one again, out loud.
  function listen() { unlock(); setSound(true); play(); }
  key.addEventListener("pointerdown", () => key.setAttribute("data-down", ""));
  addEventListener("pointerup", () => { if (!script) key.removeAttribute("data-down"); });
  key.addEventListener("click", listen);
  addEventListener("keydown", (e) => { if (e.code === "ControlRight" && !e.repeat) listen(); });
  soundButton.addEventListener("click", () => { if (soundOn) { setSound(false); } else listen(); });

  // The sheet leans toward the pointer.
  if (!reduce && matchMedia("(hover: hover)").matches) {
    let lean = null;
    page.addEventListener("pointermove", (e) => {
      if (lean) return;
      lean = requestAnimationFrame(() => {
        lean = null;
        const c = box(desk), r = page.getBoundingClientRect();
        desk.style.setProperty("--ry", `${((e.clientX - r.left - c.x) / width) * 7}deg`);
        desk.style.setProperty("--rx", `${((c.y - (e.clientY - r.top)) / height) * 6}deg`);
      });
    }, { passive: true });
  }

  if (reduce) {
    const scene = SCENES[0];
    written.textContent = scene.clean.replace(scene.fix[0], scene.fix[1]);
    appLabel.textContent = scene.app;
  } else {
    // After the page has come in, and only ever while it's on screen.
    setTimeout(() => { if (!run) play(); }, 1500);
  }
})();
</script>
</body>
</html>
